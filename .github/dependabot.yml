version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # Major-version bumps (Vite 7->8, React 18->19, vitest 2->4, …)
    # are intentionally NOT auto-proposed. We pin to a known-good set
    # and bump majors manually after a migration pass.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch minor/patch updates so we get one PR with many bumps
      # instead of five PRs a week.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
